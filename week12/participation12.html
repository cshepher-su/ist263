<!DOCTYPE html> 

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More Javascript</title>
    <script>
        function change() {
            document.getElementById("su-text").textContent = "Orange Nation";
        }
        function colorChange() {
            document.getElementById("su-text").style.color = "orange";
        }
    </script>
</head>

<body>
    <h1>Participation 12</h1>

    <p id="su-text" onclick="colorChange(); change()">Syracuse University.</p>
   

   
</body>
</html>

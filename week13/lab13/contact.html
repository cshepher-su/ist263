      <iframe title="Map showing 900 S Crouse Ave, Syracuse, NY"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2915.623673623243!2d-76.14062992404165!3d43.0493488912767!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d9f3a5e0952113%3A0xa671279445418b15!2s820-900%20S%20Crouse%20Ave%2C%20Syracuse%2C%20NY%2013210!5e0!3m2!1sen!2sus!4v1789262460617!5m2!1sen!2sus"

    <section>
      <h2>Forms</h2>
      <form action="" method="post">
        <p>
          <label for="fname">First Name:</label>
          <input type="text" id="fname" name="fname">
        </p>
        <p>
          <label for="lname">Last Name:</label>
          <input type="text" id="lname" name="lname">
        </p>

        <p>
          <label for="comments">Comments:</label><br>
          <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </p>

        <fieldset>
          <legend>Pick a number</legend>
          <input type="radio" id="number1" name="numbers" value="1">
          <label for="number1">1</label>
          <input type="radio" id="number2" name="numbers" value="2">
          <label for="number2">2</label>
        </fieldset>

        <fieldset>
          <legend>Which vehicles do you have?</legend>
          <input type="checkbox" id="veh1" name="veh1" value="Bike">
          <label for="veh1">I have a bike</label><br>
          <input type="checkbox" id="veh2" name="veh2" value="Car">
          <label for="veh2">I have a car</label>
        </fieldset>

        <p>
          <label for="cars">Select a Car:</label>
          <select id="cars" name="cars">
            <option value="BMW">BMW</option>
            <option value="Ford">Ford</option>
          </select>
        </p>

        <input type="submit" value="Submit This Form">
      </form>
    </section>
  </main>
